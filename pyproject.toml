[project]
name = "signalpost-agent"
version = "1.0.0"
description = "Evidence-first Norwegian company research agent for the Builderr Signalpost challenge"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.14.2",
  "extruct==0.18.0",
  "lxml==6.0.2",
  "pydantic==2.12.3",
  "pypdf==6.1.1",
  "rapidfuzz==3.14.1",
  "tldextract==5.3.0",
  "trafilatura==2.0.0",
  "phonenumbers==9.0.17",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
signalpost = "signalpost.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
