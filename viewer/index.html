<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signalpost — Norwegian company explorer</title>
<meta name="description" content="Every claim in this explorer carries the page it came from, when it was read and the hash of what was read.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%232F7BF6'/><text x='16' y='23' font-family='sans-serif' font-size='19' font-weight='800' fill='white' text-anchor='middle'>S</text></svg>">
</head>
<body>

<aside>
  <div class="brand"><b>S</b><span>Signalpost</span></div>

  <div class="gl">MENU</div>
  <button class="nv" data-view="companies" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M3 10.2 12 3l9 7.2V21H3z"/><path d="M9 21v-6h6v6"/></svg>
    Companies <b id="n-companies">—</b></button>
  <button class="nv" data-view="coverage">
    <svg viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>
    Coverage</button>

  <div class="gl">METHOD</div>
  <button class="nv" data-view="proof">
    <svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.4 3.4 8.3 8 9 4.6-.7 8-4.6 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>
    How a match is proved</button>
  <button class="nv" data-view="registers">
    <svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M9 21v-5h6v5"/></svg>
    Registers and licences</button>

  <div class="railfoot">
    <label class="pick">Open a run file<input id="file" type="file" accept=".jsonl,.json" hidden></label>
    <button id="theme" type="button">Switch theme</button>
    <div id="runline">no data loaded</div>
  </div>
</aside>

<main id="main">
  <p class="empty">Loading…</p>
</main>

<noscript><p class="empty" style="padding:40px">This explorer reads the run output in
the browser, so it needs JavaScript. The same data is in
<code>viewer/profiles.jsonl</code>, one envelope per line.</p></noscript>

<!-- The data is a classic script, not a fetch. A browser opened on a file://
     page refuses to fetch a sibling file, which left the previous viewer
     silently empty for anyone who double-clicked it instead of serving it. -->
<script src="profiles.js"></script>
<script src="app.js"></script>
</body>
</html>
